server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend Cloud Run service
    location /api/ {
        resolver 8.8.8.8 valid=30s;
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_set_header Host taskflow-backend-nhuil2a55q-uc.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /health {
        resolver 8.8.8.8 valid=30s;
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_set_header Host taskflow-backend-nhuil2a55q-uc.a.run.app;
        proxy_ssl_server_name on;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
